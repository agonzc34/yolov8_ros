# ROS 2 parameters file for the C++ detection pipeline
# (yolo_bringup/launch/yolo_cpp.launch.py). The launch passes this file
# verbatim as `parameters=[params_file]` and makes no topic remaps: every node
# reads its input topic from a parameter here.
#
# IMPORTANT: rclcpp loads `--params-file` sections by the node's fully
# qualified name, so each block key includes the launch namespace (default
# "yolo"). If you change `namespace:=`, update the block names to match.
#
# Honor status of the README inference knobs in the C++/ONNX implementation:
#   model / device / threshold / iou / image_reliability / image_topic /
#   n_threads / model_type / enable / max_det / max_fps -> active (drive the pipeline)
#   imgsz_height / imgsz_width                  -> informational only: the
#       input size is fixed by the ONNX tensor shape, not configurable at
#       runtime in the C++ node
#   half / augment / agnostic_nms / retina_masks -> accepted for config parity
#       with the Python node; the C++/ONNX pipeline runs FP32 with no TTA, so
#       they have no effect yet
/yolo/yolo_node:
  ros__parameters:
    model_type: auto # YOLO (=detect) | Segment | auto (decide by file name)
    model: /home/agonzc34/models/yolo26m.onnx
    device: cuda:0
    threshold: 0.7
    iou: 0.45
    imgsz_height: 640 # informational: fixed by the ONNX input tensor
    imgsz_width: 640 # informational: fixed by the ONNX input tensor
    half: false # parity only (pipeline runs FP32)
    max_det: 300
    augment: false # parity only (no TTA)
    agnostic_nms: false # parity only (not wired yet)
    retina_masks: false # parity only
    enable: true
    image_reliability: 2 # 0=SystemDefault, 1=Reliable, 2=BestEffort
    image_topic: /head_front_camera/rgb/image_raw
    n_threads: -1 # -1 = auto (only used by the CPU EP)
    max_fps: 0 # 0 = unlimited (process every frame); >0 caps inference/publish rate in Hz

/yolo/tracking_node:
  ros__parameters:
    # ByteTrack tuning, mirroring the ultralytics bytetrack.yaml defaults
    image_reliability: 2 # 0=SystemDefault, 1=Reliable, 2=BestEffort
    image_topic: /head_front_camera/rgb/image_raw
    track_high_thresh: 0.25 # first-stage association threshold
    track_low_thresh: 0.1 # second-stage threshold for low-score matches
    new_track_thresh: 0.25 # start a new track above this score
    track_buffer: 30 # frames to keep lost tracks alive
    match_thresh: 0.8 # association similarity threshold (IoU/cost)
    fuse_score: true # fuse detection score with IoU cost for matching

/yolo/detect_3d_node:
  ros__parameters:
    target_frame: base_link
    # maximum_detection_threshold:  # informational: the old fixed z-cluster
    #   guard was superseded by the robust, spatially weighted depth
    #   statistics ported from the Python detect_3d_node (mode/MAD/percentile
    #   based). Kept for config parity; does not gate inference anymore.
    maximum_detection_threshold: 0.3
    depth_image_units_divisor: 1000 # raw depth units -> meters
    depth_image_reliability: 2 # 0=SystemDefault, 1=Reliable, 2=BestEffort
    depth_info_reliability: 2
    depth_image_topic: /head_front_camera/depth/image_raw
    depth_info_topic: /head_front_camera/depth/camera_info
    detections_topic: tracking # lift the tracked stream; use "detections" if tracking is off

/yolo/debug_node:
  ros__parameters:
    image_reliability: 2 # 0=SystemDefault, 1=Reliable, 2=BestEffort
    image_topic: /head_front_camera/rgb/image_raw
    # 2D detection stream the debug node SYNCs with the image to draw and
    # publish debug_image. It runs at the full camera rate and is NOT gated by
    # the 3D/depth node, so debug_image always keeps the input frequency even
    # when depth is slow/absent:
    #   tracking   -> tracked 2D IDs (use_3d:=False, use_tracking:=True). Default.
    #   detections -> raw YOLO 2D output (tracking off)
    detections_topic: tracking
    # 3D-enriched stream read SEPARATELY just to drive the RViz 3D box /
    # keypoint markers (use_3d:=True). Markers publish at this stream's rate
    # (min(debug image, 3D detections)) and are decoupled from debug_image by
    # the node's own markers_topic subscription. Markers are persistent (lifetime
    # 0), staying visible until the next marker array updates them.
    markers_topic: detections_3d
