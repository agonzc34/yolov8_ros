# ROS 2 parameters file for the C++ pose pipeline
# (yolo_bringup/launch/yolo_cpp_pose.launch.py). The launch passes this file
# verbatim as `parameters=[params_file]` and makes no topic remaps: every node
# reads its input topic from a parameter here.
#
# IMPORTANT: rclcpp loads `--params-file` sections by the node's fully
# qualified name, so each block key includes the launch namespace (default
# "yolo_pose"). If you change `namespace:=`, update the block names to match.
#
# NOTE: `model_type: Pose` forces the pose postprocessor (COCO keypoints:
# 17 x (x, y, visible) per person), so any pose ONNX works regardless of its
# name — no need to rename/copy ultralytics `*-pose.onnx` exports.
/yolo_pose/yolo_node:
  ros__parameters:
    model_type: Pose         # force pose (auto also works if the path contains "pose")
    model: /home/agonzc34/models/yolo11n-pose.onnx
    device: cuda:0
    threshold: 0.7
    iou: 0.45
    imgsz_height: 640         # informational: fixed by the ONNX input tensor
    imgsz_width: 640          # informational: fixed by the ONNX input tensor
    half: false               # parity only (pipeline runs FP32)
    max_det: 300
    augment: false            # parity only (no TTA)
    agnostic_nms: false       # parity only (not wired yet)
    retina_masks: false       # parity only
    enable: true
    image_reliability: 1      # 0=SystemDefault, 1=Reliable, 2=BestEffort
    image_topic: /webcam_image
    n_threads: -1             # -1 = auto (only used by the CPU EP)

/yolo_pose/debug_node:
  ros__parameters:
    image_reliability: 1      # 0=SystemDefault, 1=Reliable, 2=BestEffort
    image_topic: /webcam_image
    detections_topic: detections  # no tracking node in the pose pipeline
