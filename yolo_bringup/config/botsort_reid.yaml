# ROS 2 parameters file for BoT-SORT-ReID: the C++ detection pipeline with
# ByteTrack replaced by BoT-SORT + ReID appearance association (yolo.launch.py).
# Use it with:
#   ros2 launch yolo_bringup yolo.launch.py \
#     params_file:=$(ros2 pkg prefix yolo_bringup)/share/yolo_bringup/config/botsort_reid.yaml
#
# The ReID encoder is a separate ONNX model (not shipped); export one first
# (recipes in docs/models.md) and point `reid_model` at it. Contract: NCHW RGB
# float32 [0,255], with normalization and L2 baked into the graph. OSNet-x0.25
# (MIT) is the default suggestion; FastReID SBS-S50 (Apache-2.0 code, MIT
# weights via BoT-SORT) is a drop-in alternative. Only COCO `person`
# (class_id 0) detections are embedded.
#
# IMPORTANT: rclcpp loads `--params-file` sections by the node's fully
# qualified name, so each block key includes the launch namespace (default
# "yolo"). If you change `namespace:=`, update the block names to match.
/yolo/yolo_node:
  ros__parameters:
    model_type: auto # YOLO (=detect) | Segment | Pose | OBB | Classify | auto
    model: /home/agonzc34/models/yolo26m.onnx
    model_repo: unileon-robotics/YOLO26-ONNX # HF repo id ("" -> use local `model`)
    model_filename: yolo26s.onnx # file inside that repo
    force_download: false
    device: cuda:0 # device ordinal for the CUDA/TensorRT EPs
    provider: auto
    trt_fp16_enable: true
    trt_engine_cache_enable: true
    trt_engine_cache_path: ""
    threshold: 0.7
    iou: 0.45
    max_det: 300
    enable: true
    image_reliability: 2 # 0=SystemDefault, 1=Reliable, 2=BestEffort
    image_topic: /camera/rgb/image_raw
    n_threads: -1
    max_fps: 0

/yolo/tracking_node:
  ros__parameters:
    # BoT-SORT-ReID: XYWH Kalman filter + camera-motion compensation + the
    # reference appearance (ReID) association branch.
    tracker_type: botsort # tracker implementation key (bytetrack | botsort)
    image_reliability: 2 # 0=SystemDefault, 1=Reliable, 2=BestEffort
    image_topic: /camera/rgb/image_raw
    track_high_thresh: 0.25 # first-stage association threshold
    track_low_thresh: 0.1 # second-stage threshold for low-score matches
    new_track_thresh: 0.25 # start a new track above this score
    track_buffer: 30 # frames to keep lost tracks alive
    match_thresh: 0.8 # association similarity threshold (IoU/cost)
    fuse_score: true # fuse detection score with IoU cost for matching
    gmc_method: sparseOptFlow # none | sparseOptFlow | orb | ecc
    gmc_downscale: 2 # camera-motion downscale factor (>= 1)
    with_reid: true # enable the ReID appearance branch
    # Export this first (docs/models.md); the file is not committed. On another
    # machine, override with `reid_model:=<path>`.
    reid_model: /home/agonzc34/models/osnet_x0_25_reid.onnx
    proximity_thresh: 0.5 # IoU distance above which appearance is ignored
    appearance_thresh: 0.25 # cap on the embedding distance accepted as a match
    provider: auto # encoder EP: auto = TensorRT -> CUDA -> CPU
    device: cuda:0 # encoder CUDA/TensorRT device ordinal

/yolo/detect_3d_node:
  ros__parameters:
    target_frame: camera_link
    depth_image_units_divisor: 1000 # raw depth units -> meters
    depth_image_reliability: 2 # 0=SystemDefault, 1=Reliable, 2=BestEffort
    depth_info_reliability: 2
    depth_image_topic: /camera/depth/image_raw
    depth_info_topic: /camera/depth/camera_info
    detections_topic: tracking # lift the tracked stream; use "detections" if tracking is off
    enable_orientation: false
    min_seg_points_for_orientation: 20

/yolo/debug_node:
  ros__parameters:
    image_reliability: 2 # 0=SystemDefault, 1=Reliable, 2=BestEffort
    image_topic: /camera/rgb/image_raw
    detections_topic: tracking
    markers_topic: detections_3d
    marker_lifetime: 0.5
