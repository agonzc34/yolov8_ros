/yolo/yolo_node:
  ros__parameters:
    model_type: Pose         # force pose (auto also works if the path contains "pose")
    model: /home/agonzc34/models/yolo11n-pose.onnx
    # To download the model from the Hugging Face Hub instead of a local path,
    # set model_repo + model_filename (model is then ignored). The file is
    # cached under ~/.cache/huggingface/hub and reused unless force_download.
    model_repo: "" # e.g. "agonzc34/yolo11n-pose"
    model_filename: "" # e.g. "yolo11n-pose.onnx"
    force_download: false
    device: cuda:0
    threshold: 0.7
    iou: 0.45
    max_det: 300
    enable: true
    image_reliability: 1      # 0=SystemDefault, 1=Reliable, 2=BestEffort
    image_topic: /webcam_image
    n_threads: -1             # -1 = auto (only used by the CPU EP)
    max_fps: 0                # 0 = unlimited (process every frame); >0 caps inference/publish rate in Hz

/yolo/tracking_node:
  ros__parameters:
    # Tracker selection + ByteTrack tuning, mirroring the ultralytics
    # bytetrack.yaml defaults (tracker_type keys: see yolo_ros tracking/)
    tracker_type: bytetrack # tracker implementation key (bytetrack today)
    image_reliability: 1      # 0=SystemDefault, 1=Reliable, 2=BestEffort
    image_topic: /webcam_image
    track_high_thresh: 0.25   # first-stage association threshold
    track_low_thresh: 0.1     # second-stage threshold for low-score matches
    new_track_thresh: 0.25    # start a new track above this score
    track_buffer: 30          # frames to keep lost tracks alive
    match_thresh: 0.8         # association similarity threshold (IoU/cost)
    fuse_score: true          # fuse detection score with IoU cost for matching

/yolo/detect_3d_node:
  ros__parameters:
    target_frame: base_link
    depth_image_units_divisor: 1000    # raw depth units -> meters
    depth_image_reliability: 2         # 0=SystemDefault, 1=Reliable, 2=BestEffort
    depth_info_reliability: 2
    depth_image_topic: /camera/depth/image_raw
    depth_info_topic: /camera/depth/camera_info
    detections_topic: tracking         # lift the tracked stream; use "detections" if tracking is off
    # Estimate and publish the orientation of the 3D bounding boxes (OBB via
    # PCA on a strided depth sample). Default off.
    enable_orientation: false
    min_seg_points_for_orientation: 20

/yolo/debug_node:
  ros__parameters:
    image_reliability: 1      # 0=SystemDefault, 1=Reliable, 2=BestEffort
    image_topic: /webcam_image
    # "tracking" (tracked ids), "detections" (raw YOLO output) or
    # "detections_3d" (3D-enriched, populates the RViz markers).
    detections_topic: tracking
